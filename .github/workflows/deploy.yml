name: Build models and deploy to GitHub Pages
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu && pip install onnx onnxruntime "numpy<2"
      - run: python scripts/export_onnx.py        # fails the deploy if the ONNX does not match PyTorch
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: d
        uses: actions/deploy-pages@v4
